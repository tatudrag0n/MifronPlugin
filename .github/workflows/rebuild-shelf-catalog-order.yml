name: Rebuild shelf catalog order

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-rebuild-shelf-catalog-order'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild shelf catalog ordering
        run: python3 .github/scripts/rebuild_shelf_catalog_order.py

      - name: Add shelf shop clear-all command
        run: python3 .github/scripts/add_shelfshop_clearall.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/main/java/org/server/minerva/Minerva.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/Minerva.java
          git commit -m "Update shelf shop catalog and admin commands"
          git push
