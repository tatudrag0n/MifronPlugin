name: Restore direct teleporter and frame names

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-restore-direct-teleporter-and-frame-names'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply teleporter redesign
        run: python3 .github/scripts/restore_direct_teleporter_and_frame_names.py

      - name: Normalize teleporter handler annotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/org/server/mifron/ServerPortalFeature.java')
          s = p.read_text(encoding='utf-8')
          duplicate = '''   @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n   @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n   public void onTeleporterUse(PlayerInteractEvent event)'''
          single = '''   @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n   public void onTeleporterUse(PlayerInteractEvent event)'''
          if duplicate not in s:
              raise SystemExit('duplicate teleporter annotation pattern not found')
          p.write_text(s.replace(duplicate, single, 1), encoding='utf-8')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/main/java/org/server/mifron/ServerPortalFeature.java src/main/java/org/server/mifron/UtilityItemsFeature.java src/main/java/org/server/mifron/BedrockUiFeature.java src/main/java/org/server/mifron/Mifron.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/mifron/ServerPortalFeature.java src/main/java/org/server/mifron/UtilityItemsFeature.java src/main/java/org/server/mifron/BedrockUiFeature.java src/main/java/org/server/mifron/Mifron.java
          git commit -m "Restore direct teleporter UI and editable frame names"
          git push
