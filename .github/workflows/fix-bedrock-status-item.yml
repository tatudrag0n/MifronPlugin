name: Fix Bedrock status item

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/bedrock-status-item-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Bedrock status item fix
        run: python3 .github/scripts/fix_bedrock_status_item.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source change
        run: |
          if git diff --quiet -- src/main/java/org/server/minerva/UtilityItemsFeature.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/UtilityItemsFeature.java
          git commit -m "Fix Bedrock status item native book conflict"
          git push
