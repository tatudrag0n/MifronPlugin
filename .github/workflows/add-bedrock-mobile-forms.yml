name: Add Bedrock mobile Forms UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-add-bedrock-mobile-forms'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Bedrock Forms UI changes
        run: python3 .github/scripts/add_bedrock_mobile_forms.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- pom.xml src/main/resources/plugin.yml src/main/java/org/server/minerva/Minerva.java src/main/java/org/server/minerva/BedrockUiFeature.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml src/main/resources/plugin.yml src/main/java/org/server/minerva/Minerva.java src/main/java/org/server/minerva/BedrockUiFeature.java
          git commit -m "Add native Bedrock mobile forms UI"
          git push
