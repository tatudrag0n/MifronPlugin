name: Implement world teleporter selector

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-world-teleporter-selector'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply world teleporter selector
        run: python3 .github/scripts/implement_world_teleporter_selector.py

      - name: Normalize selector source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/org/server/minerva/ServerPortalFeature.java')
          s = p.read_text(encoding='utf-8')
          if 'import org.bukkit.Bukkit;' not in s:
              s = s.replace('import org.bukkit.Axis;\n', 'import org.bukkit.Axis;\nimport org.bukkit.Bukkit;\n', 1)
          duplicate = '   @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n   @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n'
          while duplicate in s:
              s = s.replace(duplicate, '   @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/main/java/org/server/minerva/ServerPortalFeature.java src/main/java/org/server/minerva/UtilityItemsFeature.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/ServerPortalFeature.java src/main/java/org/server/minerva/UtilityItemsFeature.java
          git commit -m "Replace teleporter carousel with world item selector"
          git push
