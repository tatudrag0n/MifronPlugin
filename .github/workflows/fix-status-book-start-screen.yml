name: Fix status book start screen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/status-book-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source fix
        run: python3 .github/scripts/fix_status_book_start_screen.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source change
        run: |
          if git diff --quiet -- src/main/java/org/server/mifron/Mifron.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/mifron/Mifron.java
          git commit -m "Open status book on main status screen"
          git push
