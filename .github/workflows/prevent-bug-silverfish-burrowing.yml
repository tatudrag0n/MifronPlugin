name: Prevent Bug Mania silverfish burrowing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-prevent-bug-silverfish-burrowing'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Bug Mania silverfish fix
        run: python3 .github/scripts/prevent_bug_silverfish_burrowing.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/main/java/org/server/minerva/FfaManager.java src/main/java/org/server/minerva/FfaListener.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/FfaManager.java src/main/java/org/server/minerva/FfaListener.java
          git commit -m "Prevent Bug Mania silverfish from burrowing"
          git push
