name: Fix horizontal teleporter arc

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-fix-horizontal-teleporter-arc'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply horizontal teleporter arc
        run: python3 .github/scripts/fix_horizontal_teleporter_arc.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/main/java/org/server/mifron/ServerPortalFeature.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/mifron/ServerPortalFeature.java
          git commit -m "Make teleporter selector a horizontal arc"
          git push
