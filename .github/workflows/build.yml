name: Build MifronPlugin

on:
  pull_request:
  push:
    branches:
      - main
      - restore/v15-canonical-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Build
        run: mvn -B clean package

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' -print -quit | grep -q .
