name: Sync FFA rain weather

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-sync-ffa-rain-weather'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply FFA rain weather sync
        run: python3 .github/scripts/sync_ffa_rain_weather.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/main/java/org/server/mifron/FfaFieldItemManager.java; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/mifron/FfaFieldItemManager.java
          git commit -m "Sync FFA rain event with player weather"
          git push
