server-motd: "Mifron - Community Minecraft Server"

menu:
  # In-world fan menu shown when the menu item is used.
  fan-radius: 2.3
  fan-spread-degrees: 110.0
  fan-label-scale: 0.9
  fan-timeout-seconds: 20
  fan-close-distance: 6.0
  # Icon size. The entry under the crosshair grows and glows (label turns
  # yellow + bold) while the others shrink, so the selection is obvious.
  fan-icon-scale: 0.8
  fan-hover-multiplier: 1.25
  fan-idle-multiplier: 0.85
  fan-hover-max-angle-degrees: 20.0

trade:
  # Maximum MP either side may offer in one trade.
  max-amount: 1000000

chat:
  # Extra private-message commands to block, on top of the built-in list
  # (tell/msg/w/whisper/message/m/t/r/reply/mail/em/email and "team msg").
  # Mifron only provides public global chat; directed player-to-player
  # messages would require a 電気通信事業 filing, so this guard must stay
  # in place.
  blocked-private-commands: []

login-bonus:
  # Extra MP granted when a consecutive login streak reaches a milestone
  # (days -> MP). Shown in the in-game ログボ screen.
  streak-milestones:
    7: 2000
    30: 10000
    100: 30000

return-bonus:
  # Days away before a returning player receives the welcome-back bonus.
  days: 14
  mp: 3000

starter-goals:
  # MP paid for each post-tutorial starter goal (menu / job / mine 64 /
  # sell / protect / quest). Shown in the 目標 checklist UI.
  reward-mp: 300

referral:
  # Invite system: /mf refer issues a 6-digit code; a new player redeems it
  # with /mf refer <code>. Both sides are paid once the invitee graduates.
  reward-mp-invitee: 3000
  reward-mp-inviter: 3000
  # Only players who joined within this many days can be referred.
  eligible-days: 7
  # How long an issued code stays valid.
  code-ttl-hours: 48
  # Maximum inviter rewards per ISO week.
  weekly-cap: 5

events:
  # Weekly event schedule: pre-start/start/end broadcasts run automatically
  # and quests with a matching "event:" key are only available while active.
  # Manual control: /mf event start <id> [分] / /mf event stop / /mf event list
  fishing-festival:
    enabled: true
    name: "釣り大会"
    day: SATURDAY
    time: "20:00"
    duration-minutes: 60
    announce-minutes-before: 15

jobs:
  # Hours before a player may change jobs again.
  change-cooldown-hours: 24.0
  # Enchanter discount on advanced-anvil MP cost (percent).
  enchant-discount-percent: 20.0
  # Enchanter signature: extra enchantment levels + above-vanilla MP multiplier scale.
  enchanter-limit-break: 5
  enchanter-multiplier-scale: 0.5
  # Merchant signature: extra purchase discount percent (stacks with shop-discount).
  merchant-purchase-discount-percent: 10
  # Fisher signature: treasure roll chances on catch.
  fisher-treasure-emerald: 0.08
  fisher-treasure-diamond: 0.02
  # Income bonus percent per action, paid only to the matching job.
  bonus:
    hunt: 20.0
    harvest: 0.0
    enchant: 0.0
    sell: 10.0
    fish: 0.0
    mine: 0.0
    explore: 0.0
  # Flat MP micro-rewards for faucet-less actions, paid only to the matching job.
  base:
    harvest: 2
    fish: 5
    mine: 5
    explore: 10
  # Fast-travel fee for non-adventurers (adventurers travel free).
  travel-cost-mp: 500
  # Fast-travel cooldowns in minutes.
  travel-cooldown-minutes: 60.0
  travel-cooldown-adventurer-minutes: 10.0
  # Job levels: XP accrues from matching job actions (players.<uuid>.job.xp).
  # base-xp is the XP for level 2; each next level needs growth-percent more.
  leveling:
    base-xp: 100
    growth-percent: 15.0
    max-level: 50
    bonus-percent-per-level: 0.5
    bonus-max-percent: 25.0
    xp:
      hunt: 3
      harvest: 1
      enchant: 4
      sell: 2
      fish: 2
      mine: 1
      explore: 2
    # Level -> title unlocked at that level (see titles below).
    titles:
      10: "常連"
      25: "熟練者"
      40: "達人"
    broadcast-levels: [10, 25, 40, 50]

titles:
  # Extra titles selectable once unlocked (job levels grant these).
  job-veteran:
    display-name: "常連"
    icon: EXPERIENCE_BOTTLE
    required-advancements: []
  job-expert:
    display-name: "熟練者"
    icon: DIAMOND
    required-advancements: []
  job-master:
    display-name: "達人"
    icon: NETHERITE_INGOT
    required-advancements: []

hub-protection-radius-chunks: 4
survival-safety:
  disable-tnt: true
  disable-lava: true
  allow-admin-bypass: true

chunk-protection:
  enabled: true
  discord-channel-id: "1538131813497700352"
  warn-days-before: 7
  min-base-blocks: 8
  reject-protect-days: 90
  approved-protect-days: 0
  scan-interval-minutes: 60

# Survival's normal portals use these dimensions instead of the main world's
# Nether and End. Names are configurable so existing worlds are not renamed.
survival-dimensions:
  enabled: true
  overworld: survival
  nether: survival_nether
  end: survival_the_end

# Survival-only advanced anvil combining. The vanilla prior-work penalty and
# XP cost progression are retained; maximum-level-cost only removes the
# vanilla 40-level "Too Expensive!" ceiling for this feature.
advanced-enchanting:
  enabled: true
  allowed-worlds:
    - survival
  max-enchantment-level: 20
  maximum-level-cost: 1000000
  # When the result exceeds a vanilla enchantment maximum, XP is 0 and the
  # calculated anvil cost is charged as MP multiplied by this value.
  # Advanced levels are intentionally expensive. This is the common MP
  # multiplier; dangerous enchantments add their own multiplier below.
  mp-cost-per-level: 100
  # Per-enchantment balance caps. Missing entries use max-enchantment-level.
  # The caps are deliberately generous; the main balancing lever is MP cost.
  enchantment-level-limits:
    multishot: 5
    quick_charge: 10
    piercing: 10
    fire_aspect: 10
    looting: 10
    fortune: 10
  # Extra MP multipliers for levels above the vanilla maximum. Missing entries
  # use 1. This is separate from the level cap so balance can be tuned without
  # changing whether an enchantment is allowed at all.
  mp-cost-multipliers:
    multishot: 50
    quick_charge: 20
    piercing: 15
    fire_aspect: 12
    looting: 15
    fortune: 15
  # Empty means all materials (except excluded Mifron items) are eligible.
  allowed-materials: []
  blocked-materials: []
  blocked-enchantments: []
  excluded-item-ids:
    - emerald_bundle
    - friend_book
    - quest_book
    - teleporter
    - shelf_shop_wand
    - shop_wand
    - slot_wand
    - server_wand
    - jump_pad_wand
    - hub_compass
# Legacy fallback for minoru-bridge.secret. Keep empty so a deployment cannot
# accidentally start the bridge with a publicly-known default secret.
serverSecret: ""

