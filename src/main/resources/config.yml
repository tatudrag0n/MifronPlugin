server-motd: "Mifron - Community Minecraft Server"

hub-protection-radius-chunks: 4
survival-safety:
  disable-tnt: true
  disable-lava: true
  allow-admin-bypass: true

# Survival's normal portals use these dimensions instead of the main world's
# Nether and End. Names are configurable so existing worlds are not renamed.
survival-dimensions:
  enabled: true
  overworld: survival
  nether: survival_nether
  end: survival_the_end

# Survival-only advanced anvil combining. The vanilla prior-work penalty and
# XP cost progression are retained; maximum-level-cost only removes the
# vanilla 40-level "Too Expensive!" ceiling for this feature.
advanced-enchanting:
  enabled: true
  allowed-worlds:
    - survival
  max-enchantment-level: 20
  maximum-level-cost: 1000000
  # When the result exceeds a vanilla enchantment maximum, XP is 0 and the
  # calculated anvil cost is charged as MP multiplied by this value.
  # Advanced levels are intentionally expensive. This is the common MP
  # multiplier; dangerous enchantments add their own multiplier below.
  mp-cost-per-level: 100
  # Per-enchantment balance caps. Missing entries use max-enchantment-level.
  # The caps are deliberately generous; the main balancing lever is MP cost.
  enchantment-level-limits:
    multishot: 5
    quick_charge: 10
    piercing: 10
    fire_aspect: 10
    looting: 10
    fortune: 10
  # Extra MP multipliers for levels above the vanilla maximum. Missing entries
  # use 1. This is separate from the level cap so balance can be tuned without
  # changing whether an enchantment is allowed at all.
  mp-cost-multipliers:
    multishot: 50
    quick_charge: 20
    piercing: 15
    fire_aspect: 12
    looting: 15
    fortune: 15
  # Empty means all materials (except excluded Mifron items) are eligible.
  allowed-materials: []
  blocked-materials: []
  blocked-enchantments: []
  excluded-item-ids:
    - emerald_bundle
    - friend_book
    - quest_book
    - teleporter
    - shelf_shop_wand
    - shop_wand
    - slot_wand
    - server_wand
    - jump_pad_wand
    - hub_compass
# Legacy fallback for minoru-bridge.secret. Keep empty so a deployment cannot
# accidentally start the bridge with a publicly-known default secret.
serverSecret: ""

